name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint (ESLint em todos os packages)
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api lint

      - name: Lint Web (TypeScript check)
        run: pnpm --filter web exec tsc --noEmit
        env:
          # Variáveis mínimas para o type-check do Next.js não falhar em imports de env
          API_INTERNAL_URL: http://localhost:3001
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-nextauth-secret-placeholder

  # ─────────────────────────────────────────
  # JOB 2: Testes unitários e integração (API)
  # ─────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barberflow
          POSTGRES_PASSWORD: barberflow
          POSTGRES_DB: barberflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://barberflow:barberflow@localhost:5432/barberflow_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-x
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars-x
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
      DEFAULT_TENANT_ID: tenant-test-001
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations (deploy mode — sem prompt interativo)
        run: pnpm --filter api exec prisma migrate deploy --schema=src/infrastructure/database/prisma/schema.prisma

      - name: Run unit tests (API)
        run: pnpm --filter api test

      - name: Run integration tests (API)
        run: pnpm --filter api test:integration

  # ─────────────────────────────────────────
  # JOB 3: Build (verifica que compila sem erros)
  # ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    env:
      # Variáveis necessárias para o Next.js compilar sem erro
      API_INTERNAL_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret-minimum-32-chars
      DEFAULT_TENANT_ID: tenant-test-001
      # Variáveis da API
      DATABASE_URL: postgresql://barberflow:barberflow@localhost:5432/barberflow_build
      JWT_SECRET: ci-jwt-secret-minimum-32-characters-x
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-chars-x
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development

      - name: Build API (NestJS)
        run: pnpm --filter api build

      - name: Build Web (Next.js)
        run: pnpm --filter web build
