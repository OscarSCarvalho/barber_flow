version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: barberflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: barberflow
      POSTGRES_DB: barberflow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U barberflow']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: barberflow_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: barberflow_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://barberflow:barberflow@postgres:5432/barberflow?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-jwt-secret-change-in-prod
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-prod
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      API_PORT: 3001
      NODE_ENV: development
    ports:
      - '3001:3001'
    volumes:
      - ./apps/api/src:/app/src
      - ./packages:/packages

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: barberflow_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-nextauth-secret-change-in-prod
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/src:/app/src

volumes:
  postgres_data:
  redis_data:
